[project]
name = "va-agent"
version = "0.1.0"
description = "VA-Agent Demo für PICTS 17.04.2026"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60.0",
    "elevenlabs>=2.0.0",
    "fal-client>=0.4.0",
    "runwayml>=3.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "python-multipart",
    "pdfplumber>=0.11.0",
    "weasyprint>=62.0",
    "python-pptx>=1.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "jinja2>=3.1.0",
    "python-dotenv",
    "pydantic>=2.0",
    "rich",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
